<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petra | Astral Reverie</title>
<meta name="color-scheme" content="dark">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg-0: #020106;
  --cream: #f4f0e6;
  --cream-dim: #c5c0b5;
  --muted: #8b92a5;
  --muted-2: #5f667a;
  --line: rgba(180, 195, 225, 0.25);
  --accent-stellar: #ffb86c;
  --accent-lunara: #8be9fd;
  --card-bg: rgba(12, 14, 25, 0.75);
  --card-border: rgba(255, 255, 255, 0.12);
  --ease: cubic-bezier(0.22, 0.9, 0.3, 1);
  --px: 0px;
  --py: 0px;
}

* { box-sizing: border-box; }
html, body { 
  margin: 0; padding: 0; background: var(--bg-0); color: var(--cream); 
  font-family: 'Inter', system-ui, sans-serif; 
}
body { min-height: 100vh; overflow-x: hidden; }

/* Canvas Background Engine */
#cosmos-canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 0;
  pointer-events: none;
}

#ui-layer {
  position: relative; 
  z-index: 5;
  transform: translate(calc(var(--px) * 0.3), calc(var(--py) * 0.3));
  transition: transform 0.1s ease-out;
}

/* UI Elements */
#topbar { display: flex; justify-content: space-between; align-items: center; padding: 22px 26px; }
#back-link {
  display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
  font-size: 13px; letter-spacing: 0.05em; color: var(--muted); transition: color 200ms var(--ease);
}
#back-link:hover { color: var(--cream); }
#back-link svg { width: 14px; height: 14px; }
#site-mark { font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: 0.1em; color: var(--muted-2); }

#page-head { text-align: center; padding: 10px 24px 30px; max-width: 560px; margin: 0 auto; }
#page-head .eyebrow { font-size: 11px; letter-spacing: 0.25em; color: var(--muted-2); margin-bottom: 12px; }
#page-head h1 { margin: 0; font-family: 'Cormorant Garamond', serif; font-size: clamp(32px, 5vw, 48px); font-weight: 600; color: var(--cream); }
#page-head .tagline { font-size: 14px; color: var(--muted); line-height: 1.6; margin: 16px auto 0; font-weight: 300; }

/* Stage */
#stage-wrap { display: flex; align-items: center; justify-content: center; padding: 0 20px 80px; }
#orbit-stage { position: relative; width: min(90vw, 75vh, 800px); height: min(90vw, 75vh, 800px); flex-shrink: 0; isolation: isolate; }
#orbit-stage::before,
#orbit-stage::after {
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%, -50%);
}
#orbit-stage::before {
  width: 31%; height: 31%;
  background: radial-gradient(circle, rgba(255, 217, 154, 0.2) 0%, rgba(255, 126, 92, 0.09) 34%, rgba(16, 12, 28, 0) 72%);
  filter: blur(5px);
  z-index: 0;
}
#orbit-stage::after {
  width: 45%; height: 45%;
  border: 1px solid rgba(139, 233, 253, 0.12);
  box-shadow: 0 0 0 16px rgba(255, 184, 108, 0.035), 0 0 70px rgba(255, 126, 92, 0.08);
  z-index: 0;
}
#orbit-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; z-index: 1; pointer-events: none; }
.leader-line { stroke: var(--line); stroke-width: 1.5; opacity: 0; transition: opacity 400ms var(--ease); stroke-dasharray: 4 4; }
.leader-line.shown { opacity: 0.8; stroke-dasharray: none; }

/* Interactive Nodes */
.star-node {
  position: absolute; width: 18px; height: 18px; border-radius: 50%; z-index: 4;
  transform: translate(-50%, -50%); cursor: pointer;
  transition: transform 300ms var(--ease), box-shadow 300ms var(--ease);
}
.star-node::after {
  content: ''; position: absolute; inset: -12px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.25); opacity: 0; transform: scale(0.5);
  transition: all 300ms var(--ease);
}
.star-node:hover, .star-node:focus-visible { transform: translate(-50%, -50%) scale(1.4); }
.star-node:hover::after { opacity: 1; transform: scale(1.2); animation: spin 4s linear infinite; }

@keyframes spin { 100% { transform: scale(1.2) rotate(360deg); } }

/* Glassmorphic Cards */
.poem-chip {
  position: absolute; width: 190px; z-index: 10; transform: translate(-50%, -50%) scale(0.95);
  background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px;
  padding: 18px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.15);
  opacity: 0; pointer-events: none; transition: all 300ms var(--ease); text-align: center;
}
.poem-chip.shown { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
.poem-chip .num { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 8px; }
.poem-chip h3 { margin: 0 0 8px; font-family: 'Cormorant Garamond', serif; font-size: 21px; font-weight: 600; color: var(--cream); }
.poem-chip p { margin: 0 0 14px; font-size: 11px; line-height: 1.5; color: var(--cream-dim); font-weight: 300; }
.chip-btn {
  font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 0.05em; padding: 8px 18px;
  border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); color: var(--cream);
  background: rgba(255,255,255,0.06); cursor: pointer; transition: all 200ms ease;
}
.chip-btn:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); }

/* Modal */
#modal-veil {
  position: fixed; inset: 0; z-index: 50; background: rgba(2, 1, 6, 0.88); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  opacity: 0; pointer-events: none; transition: opacity 400ms var(--ease);
}
#modal-veil.show { opacity: 1; pointer-events: auto; }
#poem-modal {
  width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto;
  background: rgba(14, 11, 24, 0.95); border: 1px solid rgba(255,255,255,0.15); border-radius: 24px;
  padding: 40px; position: relative;
  box-shadow: 0 25px 60px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.08);
  transform: translateY(20px) scale(0.95); opacity: 0; transition: all 400ms var(--ease);
}
#modal-veil.show #poem-modal { transform: translateY(0) scale(1); opacity: 1; }
#modal-close {
  position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.06); border: none; color: var(--muted);
  font-size: 24px; cursor: pointer; width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; transition: all 200ms ease;
}
#modal-close:hover { color: #fff; background: rgba(255,255,255,0.2); }
#modal-title { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 600; margin: 0 0 24px; color: var(--cream); text-align: center; }
#modal-body { font-family: 'Cormorant Garamond', serif; font-size: 19px; line-height: 1.85; color: var(--cream-dim); white-space: pre-line; text-align: center; }

/* Responsive Stacked Mode */
body.stacked #orbit-svg, body.stacked .star-node { display: none; }
body.stacked #orbit-stage { width: 100%; height: auto; }
body.stacked .poem-chip {
  position: relative; inset: auto; transform: none !important; opacity: 1; pointer-events: auto;
  width: min(90vw, 400px); margin: 0 auto 20px; display: block; text-align: center;
}
body.stacked #poem-list { display: flex; flex-direction: column; align-items: center; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}
</style>
</head>
<body>

<!-- High-Fidelity Canvas Rendering Background -->
<canvas id="cosmos-canvas"></canvas>

<div id="ui-layer">
  <div id="topbar">
    <a id="back-link" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
      Back to Petra
    </a>
    <span id="site-mark">PETRA</span>
  </div>

  <header id="page-head">
    <div class="eyebrow">STELLAR & LUNARA</div>
    <h1>Astral Reverie</h1>
    <p class="tagline">Born of the Orion Nebula. A dichotomy of blazing gold and tranquil ice, written in the stars.</p>
  </header>

  <div id="stage-wrap">
    <div id="orbit-stage">
      <svg id="orbit-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <g id="leader-lines"></g>
      </svg>
      <div id="poem-list"></div>
    </div>
  </div>
</div>

<div id="modal-veil">
  <div id="poem-modal" role="dialog" aria-modal="true">
    <button id="modal-close" aria-label="Close">&times;</button>
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const POEMS = [
    { num:"01", type:"stellar", title:"Nova", blurb:"The roar of ignition; life demanding to be felt.",
      angle:-60, radius:18, gas:"rgba(255, 120, 80, 0.5)", color:"#ff8a50",
      text:"I am the fire that tears the dark apart,\nThe sudden heartbeat of a dying star.\nI ask no permission to exist,\nOnly that you witness the heat." },
    { num:"02", type:"lunara", title:"Eclipse", blurb:"The quiet moment when shadows align.",
      angle:195, radius:24, gas:"rgba(100, 200, 255, 0.4)", color:"#8be9fd",
      text:"In the absence of your light, I do not fade.\nI become the silver lining of the void.\nA gentle reflection, holding the memory\nOf a warmth I cannot touch." },
    { num:"03", type:"stellar", title:"Supernova", blurb:"Destruction that seeds the cosmos.",
      angle:45, radius:32, gas:"rgba(255, 60, 100, 0.5)", color:"#ff5252",
      text:"Burn it all down.\nLet the core collapse.\nFrom this wreckage, a thousand new worlds\nWill learn how to breathe." },
    { num:"04", type:"lunara", title:"Voidsong", blurb:"The silence between the celestial bodies.",
      angle:260, radius:35, gas:"rgba(130, 100, 255, 0.4)", color:"#b388ff",
      text:"Listen to the space between the stars.\nIt is not empty.\nIt is the held breath of the universe,\nWaiting for you to speak." },
    { num:"05", type:"stellar", title:"Solar Wind", blurb:"A violent, beautiful storm of particles.",
      angle:120, radius:28, gas:"rgba(255, 200, 50, 0.4)", color:"#ffd740",
      text:"I cross the expanse not with grace,\nBut with fury.\nI paint the poles of distant planets\nWith the colors of my rage." },
    { num:"06", type:"lunara", title:"Stardust", blurb:"The cold remnants of ancient light.",
      angle:-10, radius:38, gas:"rgba(150, 230, 240, 0.4)", color:"#84ffff",
      text:"We are the quiet aftermath.\nThe dust settling on the cosmic floor.\nOnce we were fire;\nNow, we are poetry." }
  ];

  const stage = document.getElementById("orbit-stage");
  const list = document.getElementById("poem-list");
  const leaderLayer = document.getElementById("leader-lines");

  function polar(angleDeg, radiusPct){
    const a = angleDeg * Math.PI/180;
    return { x: 50 + radiusPct*Math.cos(a), y: 50 + radiusPct*Math.sin(a) };
  }

  // Generate Interactive Nodes
  POEMS.forEach((p) => {
    const pos = polar(p.angle, p.radius);
    const labelPos = polar(p.angle, p.radius + 12); 

    const star = document.createElement("div");
    star.className = "star-node";
    star.style.left = pos.x + "%"; star.style.top = pos.y + "%";
    star.style.background = `radial-gradient(circle, #fff 0%, ${p.color} 40%, transparent 80%)`;
    star.style.boxShadow = `0 0 15px 4px ${p.color}`;
    star.setAttribute("role","button");
    star.setAttribute("tabindex","0");
    stage.appendChild(star);

    const line = document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("class","leader-line");
    line.setAttribute("x1", pos.x); line.setAttribute("y1", pos.y);
    line.setAttribute("x2", labelPos.x); line.setAttribute("y2", labelPos.y);
    leaderLayer.appendChild(line);

    const chip = document.createElement("div");
    chip.className = "poem-chip";
    chip.style.left = labelPos.x + "%"; chip.style.top = labelPos.y + "%";
    chip.innerHTML = `
      <div class="num">${p.num} &mdash; ${p.type.toUpperCase()}</div>
      <h3>${p.title}</h3>
      <p>${p.blurb}</p>
      <button class="chip-btn" type="button">Read Poem</button>
    `;
    stage.appendChild(chip);
    list.appendChild(chip.cloneNode(true));

    const openThis = () => openPoem(p);
    star.addEventListener("click", openThis);
    chip.querySelector(".chip-btn").addEventListener("click", openThis);

    const reveal = () => { chip.classList.add("shown"); line.classList.add("shown"); };
    const hide = () => { chip.classList.remove("shown"); line.classList.remove("shown"); };
    star.addEventListener("mouseenter", reveal);
    star.addEventListener("mouseleave", hide);
    chip.addEventListener("mouseenter", reveal);
    chip.addEventListener("mouseleave", hide);
  });

  document.querySelectorAll('#poem-list .poem-chip').forEach((c, idx) => {
    c.querySelector('.chip-btn').addEventListener('click', () => openPoem(POEMS[idx]));
  });

  // --- HTML5 Canvas Orion Nebula & Realistic Star Engine ---
  const canvas = document.getElementById("cosmos-canvas");
  const ctx = canvas.getContext("2d");

  let width, height;
  function resizeCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  // Create Nebula Gas Clouds
  const clouds = [
    { x: 0.35, y: 0.35, r: 450, color: "rgba(255, 20, 147, 0.18)", vx: 0.0002, vy: 0.00015 },
    { x: 0.65, y: 0.60, r: 520, color: "rgba(0, 220, 255, 0.14)", vx: -0.00015, vy: -0.0002 },
    { x: 0.50, y: 0.50, r: 380, color: "rgba(255, 165, 0, 0.22)", vx: 0.0001, vy: -0.0001 },
    { x: 0.25, y: 0.70, r: 480, color: "rgba(110, 30, 180, 0.22)", vx: -0.0002, vy: 0.00015 },
    { x: 0.75, y: 0.30, r: 400, color: "rgba(255, 80, 150, 0.15)", vx: 0.00015, vy: 0.0002 }
  ];

  // Create Starfield Population
  const starCount = window.innerWidth < 768 ? 400 : 1200;
  const stars = [];
  const dust = [];
  const starColors = ["#ffffff", "#f0f4ff", "#ffeedd", "#ffb86c", "#8be9fd", "#ff79c6"];

  for (let i = 0; i < starCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.pow(Math.random(), 2.5) * Math.max(width, height) * 0.6;
    stars.push({
      x: width / 2 + Math.cos(angle) * dist,
      y: height / 2 + Math.sin(angle) * dist,
      baseRadius: Math.random() * 1.5 + 0.3,
      color: starColors[Math.floor(Math.random() * starColors.length)],
      alpha: Math.random() * 0.8 + 0.2,
      twinkleSpeed: 0.01 + Math.random() * 0.03,
      twinkleOffset: Math.random() * Math.PI * 2
    });
  }

  for (let i = 0; i < 90; i++) {
    const angle = Math.random() * Math.PI * 2;
    const distance = 0.16 + Math.random() * 0.34;
    dust.push({
      angle,
      distance,
      size: Math.random() * 1.1 + 0.2,
      alpha: Math.random() * 0.35 + 0.08,
      speed: (Math.random() * 0.0007 + 0.00025) * (Math.random() > 0.5 ? 1 : -1)
    });
  }

  let mouseX = 0, mouseY = 0;
  document.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / width - 0.5);
    mouseY = (e.clientY / height - 0.5);
    document.documentElement.style.setProperty('--px', `${mouseX * 50}px`);
    document.documentElement.style.setProperty('--py', `${mouseY * 50}px`);
  });

  let time = 0;
  function animateCosmos() {
    time += 0.01;
    ctx.clearRect(0, 0, width, height);

    // Deep Vignette Background
    const bgGradient = ctx.createRadialGradient(width/2, height/2, 50, width/2, height/2, Math.max(width, height)*0.75);
    bgGradient.addColorStop(0, "#150a1a");
    bgGradient.addColorStop(0.45, "#0a0815");
    bgGradient.addColorStop(0.8, "#030206");
    bgGradient.addColorStop(1, "#010102");
    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, width, height);

    // Render Nebula Gas Clouds with smooth sine drift
    ctx.globalCompositeOperation = 'screen';
    clouds.forEach((c, idx) => {
      const cx = width * c.x + Math.sin(time * c.vx * 1000 + idx) * 60 + mouseX * -30;
      const cy = height * c.y + Math.cos(time * c.vy * 1000 + idx) * 60 + mouseY * -30;
      
      const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, c.r);
      grad.addColorStop(0, c.color);
      grad.addColorStop(1, "rgba(0,0,0,0)");

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, c.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // Fine dust and orbit haze give the nebula a denser, more dimensional core.
    ctx.globalCompositeOperation = 'screen';
    dust.forEach((particle) => {
      const angle = particle.angle + time * particle.speed * 60;
      const radius = particle.distance * Math.min(width, height);
      const px = width / 2 + Math.cos(angle) * radius + mouseX * -12;
      const py = height / 2 + Math.sin(angle) * radius * 0.58 + mouseY * -12;
      ctx.globalAlpha = particle.alpha;
      ctx.fillStyle = particle.distance > 0.3 ? '#8be9fd' : '#ffd39a';
      ctx.beginPath();
      ctx.arc(px, py, particle.size, 0, Math.PI * 2);
      ctx.fill();
    });

    const core = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, Math.min(width, height) * 0.25);
    core.addColorStop(0, 'rgba(255, 236, 190, 0.16)');
    core.addColorStop(0.22, 'rgba(255, 153, 106, 0.08)');
    core.addColorStop(0.58, 'rgba(139, 233, 253, 0.025)');
    core.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(width / 2, height / 2, Math.min(width, height) * 0.25, 0, Math.PI * 2);
    ctx.fill();

    // Render Stars with Individual Twinkling Phase & Parallax
    ctx.globalCompositeOperation = 'source-over';
    stars.forEach(s => {
      const twinkle = Math.sin(time * s.twinkleSpeed * 60 + s.twinkleOffset);
      const currentAlpha = Math.max(0.05, s.alpha + twinkle * 0.25);
      
      // Apply subtle mouse parallax shift
      const px = s.x + mouseX * -20;
      const py = s.y + mouseY * -20;

      ctx.fillStyle = s.color;
      ctx.globalAlpha = currentAlpha;
      ctx.beginPath();
      ctx.arc(px, py, s.baseRadius, 0, Math.PI * 2);
      ctx.fill();

      // Soft glow for bright stars
      if (s.baseRadius > 1.2 && currentAlpha > 0.6) {
        ctx.shadowBlur = 8;
        ctx.shadowColor = s.color;
        ctx.fill();
        ctx.shadowBlur = 0; // reset
      }
    });

    ctx.globalAlpha = 1.0;
    requestAnimationFrame(animateCosmos);
  }
  animateCosmos();

  // Modal Logic
  const veil = document.getElementById("modal-veil");
  const modalTitle = document.getElementById("modal-title");
  const modalBody = document.getElementById("modal-body");

  function openPoem(p){
    modalTitle.style.color = p.color;
    modalTitle.textContent = p.title;
    modalBody.textContent = p.text;
    veil.classList.add("show");
  }
  
  function closePoem(){ veil.classList.remove("show"); }
  document.getElementById("modal-close").addEventListener("click", closePoem);
  veil.addEventListener("click", e => { if(e.target===veil) closePoem(); });
  window.addEventListener("keydown", e => { if(e.key==="Escape") closePoem(); });

  // Layout mode switcher for mobile stacking
  function applyLayoutMode(){
    if(window.innerWidth < 760){
      document.body.classList.add("stacked");
      document.getElementById('poem-list').style.display = 'flex';
    } else {
      document.body.classList.remove("stacked");
      document.getElementById('poem-list').style.display = 'none';
    }
  }
  window.addEventListener("resize", applyLayoutMode);
  applyLayoutMode();

})();
</script>
</body>
</html>
