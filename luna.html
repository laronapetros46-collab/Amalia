<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Petra | Celestial Echoes</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    :root {
      --bg-deep: #0a0b10;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: var(--bg-deep);
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .font-serif {
      font-family: 'Playfair Display', serif;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      /* Subtle radial gradient to blend with 3D space */
      background: radial-gradient(circle at center, #1c192b 0%, #0a0b10 100%);
    }

    /* UI Overlay Layer */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* Let clicks pass through to canvas */
      z-index: 10;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 40px;
      pointer-events: auto;
    }

    /* Elegant Glassmorphism */
    .glass {
      background: rgba(18, 16, 26, 0.5);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .floating-panel {
      position: absolute;
      right: 40px;
      bottom: 40px;
      width: min(260px, calc(100vw - 32px));
      padding: 18px 20px 16px;
      border-radius: 18px;
      pointer-events: auto;
      transition: transform 0.35s ease, border-color 0.35s ease;
    }

    .floating-panel:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.18);
    }

    .eyebrow {
      letter-spacing: 0.32em;
      text-transform: uppercase;
      font-size: 10px;
      color: rgba(255,255,255,0.55);
      margin-bottom: 10px;
    }

    .panel-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.3rem, 1.4vw, 1.7rem);
      margin: 0 0 6px;
      color: white;
    }

    .panel-copy {
      font-size: 12px;
      line-height: 1.7;
      color: rgba(226, 232, 240, 0.7);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0;
    }

    /* Dynamic Hover Label */
    #hover-label {
      position: absolute;
      transform: translate(-50%, -150%);
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.1s ease;
      pointer-events: none;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: rgba(10, 10, 15, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    /* Reading Modal */
    #poem-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -40%) scale(0.96);
      width: min(90vw, 540px);
      opacity: 0;
      visibility: hidden;
      pointer-events: auto;
      border-radius: 20px;
      padding: 42px 32px 32px;
      text-align: center;
      background: linear-gradient(180deg, rgba(13,12,17,0.72), rgba(17,16,23,0.8));
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 24px 80px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #poem-modal.active {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    .poem-text {
      font-size: 1.1rem;
      line-height: 2.2;
      color: #e2e8f0;
      margin: 35px 0;
      white-space: pre-line;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .btn-return {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 12px 30px;
      border-radius: 40px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.4s ease;
    }

    .btn-return:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- 3D Canvas Container -->
  <div id="canvas-container"></div>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <header class="flex justify-between items-start">
      <div>
        <h1 class="font-serif text-3xl font-medium tracking-wider text-white drop-shadow-md">PETRA</h1>
        <p class="text-xs uppercase tracking-[0.4em] text-gray-400 mt-2">Celestial Echoes</p>
      </div>
      <div class="text-right text-xs text-gray-400 max-w-[220px] leading-relaxed hidden sm:block tracking-wide">
        Observe the serene orbital ballet.<br>Select a sphere to unveil its echo.
      </div>
    </header>

    <div id="hover-label" class="font-serif italic">Anthology</div>

    <aside class="floating-panel glass" aria-live="polite">
      <div class="eyebrow">Selected orbit</div>
      <h2 id="selection-name" class="panel-title">Pearl of the Void</h2>
      <p id="selection-desc" class="panel-copy">Starlight &amp; Silence</p>
    </aside>

    <div id="poem-modal" class="glass">
      <div class="text-[10px] uppercase tracking-[0.3em] text-gray-400 mb-3" id="modal-subtitle">Anthology</div>
      <h2 class="font-serif text-4xl text-white mb-4" id="modal-title">Title</h2>
      
      <div class="w-16 h-[1px] bg-gradient-to-r from-transparent via-white/40 to-transparent mx-auto mt-6 mb-4"></div>
      
      <p class="font-serif italic poem-text" id="modal-content">
        Poem content goes here.
      </p>

      <button class="btn-return mt-4" id="btn-back">Return to Orbit</button>
    </div>
  </div>

  <script>
    // Premium Color Palette and Poetic Content
    const celestialData = [
      {
        id: "pearl",
        name: "Pearl of the Void",
        subtitle: "Starlight & Silence",
        color: 0xfdfbf7, // Pearl White
        emissive: 0x4a4a4a,
        size: 3.5,
        baseDistance: 45,
        speed: 0.0012, // Very slow
        poem: `A singular gleam in the ocean of night,\nA delicate breath woven softly from light.\nIt travels the dark with a quietest grace,\nA pearl suspended in boundless space.`
      },
      {
        id: "gold",
        name: "Aureate Dust",
        subtitle: "Warmth & Memory",
        color: 0xe6c27a, // Soft Gold
        emissive: 0x5a482b,
        size: 4.8,
        baseDistance: 75,
        speed: 0.0009,
        poem: `Golden embers drifting astray,\nRemnants of suns that have faded away.\nWe are woven from memories scattered and grand,\nThe universe held like gold dust in hand.`
      },
      {
        id: "violet",
        name: "Amethyst Veil",
        subtitle: "Mystery & Nebula",
        color: 0x8a78a3, // Muted Violet
        emissive: 0x362c45,
        size: 6,
        baseDistance: 110,
        speed: 0.0006,
        poem: `A violet shadow spun from the deep,\nWhere forgotten constellations softly sleep.\nIn swirling clouds of amethyst hue,\nCreation whispers a story anew.`
      },
      {
        id: "azure",
        name: "Cerulean Deep",
        subtitle: "Tide & Time",
        color: 0x4f7cac, // Azure Blue
        emissive: 0x1f354d,
        size: 5,
        baseDistance: 145,
        speed: 0.00045,
        poem: `Silent oceans of indigo shade,\nWhere the currents of gravity subtly fade.\nA sapphire jewel in the cosmic sea,\nReflecting the depths of eternity.`
      },
      {
        id: "rose",
        name: "Crimson Ember",
        subtitle: "Passion & Dust",
        color: 0xb5838d, // Rose Dust
        emissive: 0x4d3338,
        size: 4.2,
        baseDistance: 180,
        speed: 0.0003,
        poem: `A solitary rose blooming out in the cold,\nA fiery secret that begs to be told.\nIt burns with a gentle and lingering heat,\nWhere the shadows and starlight quietly meet.`
      }
    ];

    function toCssHex(value) {
      return '#' + value.toString(16).padStart(6, '0');
    }

    function createPlanetTexture(baseColor, accentColor, highlight = '#ffffff') {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      const gradient = ctx.createRadialGradient(88, 72, 18, 128, 128, 150);
      gradient.addColorStop(0, highlight);
      gradient.addColorStop(0.22, baseColor);
      gradient.addColorStop(0.8, accentColor);
      gradient.addColorStop(1, '#111827');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 256, 256);

      for (let i = 0; i < 700; i++) {
        const x = Math.random() * 256;
        const y = Math.random() * 256;
        const radius = Math.random() * 4 + 1;
        const alpha = 0.08 + Math.random() * 0.2;
        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let stripe = 0; stripe < 12; stripe++) {
        const y = stripe * 22 + Math.random() * 14;
        ctx.fillStyle = `rgba(255,255,255,${0.02 + stripe * 0.005})`;
        ctx.fillRect(0, y, 256, 3 + Math.random() * 6);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.needsUpdate = true;
      return texture;
    }

    // --- STREAMING_CHUNK:Setting up Scene, Camera, and Renderer ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    // Transparent background so CSS radial gradient shows through
    scene.background = null; 
    scene.fog = new THREE.FogExp2(0x0a0b10, 0.0012);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 2000);
    const defaultCameraPos = new THREE.Vector3(0, 160, 260);
    camera.position.copy(defaultCameraPos);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.04;
    controls.maxDistance = 700;
    controls.minDistance = 60;
    controls.enablePan = false; // Keep focus on center

    // --- STREAMING_CHUNK:Adding Ambient Starfield and Lighting ---
    // Soft ambient lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    // Central Star Point Light (Hot blue-white solar glow)
    const starLight = new THREE.PointLight(0xcfe7ff, 2.4, 800);
    starLight.position.set(0, 0, 0);
    scene.add(starLight);

    // Deep Space Starfield (Subtle, elegant background)
    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = 2000;
    const posArray = new Float32Array(starsCount * 3);
    const opacities = new Float32Array(starsCount);

    for(let i = 0; i < starsCount; i++) {
      const radius = 400 + Math.random() * 800;
      const theta = 2 * Math.PI * Math.random();
      const phi = Math.acos(2 * Math.random() - 1);
      
      posArray[i*3] = radius * Math.sin(phi) * Math.cos(theta);
      posArray[i*3+1] = radius * Math.sin(phi) * Math.sin(theta);
      posArray[i*3+2] = radius * Math.cos(phi);
      
      opacities[i] = Math.random();
    }

    starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    starsGeometry.setAttribute('alpha', new THREE.BufferAttribute(opacities, 1));
    
    // Custom shader for twinkling stars
    const starMaterial = new THREE.ShaderMaterial({
      uniforms: { time: { value: 0 } },
      vertexShader: `
        attribute float alpha;
        varying float vAlpha;
        void main() {
          vAlpha = alpha;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = (2.0 / -mvPosition.z) * 100.0;
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        uniform float time;
        varying float vAlpha;
        void main() {
          float twinkle = sin(time * 2.0 + vAlpha * 10.0) * 0.5 + 0.5;
          float finalAlpha = vAlpha * twinkle * 0.7;
          
          // Soft circular particle
          vec2 xy = gl_PointCoord.xy - vec2(0.5);
          float ll = length(xy);
          if(ll > 0.5) discard;
          
          gl_FragColor = vec4(1.0, 0.98, 0.95, finalAlpha * (1.0 - (ll*2.0)));
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    
    const starMesh = new THREE.Points(starsGeometry, starMaterial);
    scene.add(starMesh);

    // --- STREAMING_CHUNK:Constructing Central Star & Planet Geometries ---
    // Central Star (Hot blue-white solar sphere with realistic glow)
    const centralStarGroup = new THREE.Group();
    
    const coreGeo = new THREE.SphereGeometry(12, 64, 64);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xdfeeff }); // cooler white-blue center
    const core = new THREE.Mesh(coreGeo, coreMat);
    centralStarGroup.add(core);

    // Additive blending layers for a more natural solar bloom
    const createGlow = (radius, opacity, color = 0xcfe7ff) => {
      const gGeo = new THREE.SphereGeometry(radius, 64, 64);
      const gMat = new THREE.MeshBasicMaterial({ 
        color: color, 
        transparent: true, 
        opacity: opacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      return new THREE.Mesh(gGeo, gMat);
    };

    centralStarGroup.add(createGlow(14, 0.7, 0xdfeeff));
    centralStarGroup.add(createGlow(18, 0.35, 0xbfdcff));
    centralStarGroup.add(createGlow(26, 0.14, 0x9bc7ff));
    centralStarGroup.add(createGlow(34, 0.06, 0x7caef7));
    scene.add(centralStarGroup);

    // Subtle asteroid belt to add a bit of realistic solar-system depth
    const asteroidGeometry = new THREE.BufferGeometry();
    const asteroidCount = 1200;
    const asteroidPositions = new Float32Array(asteroidCount * 3);

    for (let i = 0; i < asteroidCount; i++) {
      const ringRadius = 135 + Math.random() * 26;
      const angle = Math.random() * Math.PI * 2;
      const height = (Math.random() - 0.5) * 10;

      asteroidPositions[i * 3] = Math.cos(angle) * ringRadius;
      asteroidPositions[i * 3 + 1] = height;
      asteroidPositions[i * 3 + 2] = Math.sin(angle) * ringRadius;
    }

    asteroidGeometry.setAttribute('position', new THREE.BufferAttribute(asteroidPositions, 3));

    const asteroidMaterial = new THREE.PointsMaterial({
      color: 0xb7c0d4,
      size: 1.6,
      transparent: true,
      opacity: 0.8,
      depthWrite: false
    });

    const asteroidBelt = new THREE.Points(asteroidGeometry, asteroidMaterial);
    asteroidBelt.rotation.x = 0.35;
    asteroidBelt.rotation.z = 0.08;
    scene.add(asteroidBelt);

    // Array to hold dynamic planet data
    const planets = [];

    // Construct Planets and Orbits
    celestialData.forEach((data) => {
      const group = new THREE.Group();
      
      const baseHex = toCssHex(data.color);
      const accentHex = toCssHex(data.emissive);
      const planetTexture = createPlanetTexture(baseHex, accentHex, '#f8fafc');

      // Elegant material settings with subtle procedural texture detail
      const mat = new THREE.MeshStandardMaterial({
        map: planetTexture,
        color: 0xffffff,
        emissive: data.emissive,
        emissiveIntensity: 0.7,
        roughness: 0.8,
        metalness: 0.08,
        bumpMap: planetTexture,
        bumpScale: 0.18,
      });

      const geo = new THREE.SphereGeometry(data.size, 64, 64);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.userData = { isPlanet: true, ...data };
      group.add(mesh);

      // Add a very subtle atmosphere glow to the planets
      const atmoGeo = new THREE.SphereGeometry(data.size + 0.3, 32, 32);
      const atmoMat = new THREE.MeshBasicMaterial({
        color: data.color,
        transparent: true,
        opacity: 0.15,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const atmo = new THREE.Mesh(atmoGeo, atmoMat);
      group.add(atmo);

      // Random initial angle on the circle
      const angle = Math.random() * Math.PI * 2;
      
      scene.add(group);

      // Draw delicate, highly transparent orbit rings
      const ringGeo = new THREE.RingGeometry(data.baseDistance - 0.15, data.baseDistance + 0.15, 128);
      const ringMat = new THREE.MeshBasicMaterial({ 
        color: 0xffffff, 
        transparent: true, 
        opacity: 0.04, 
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI / 2;
      scene.add(ring);

      planets.push({
        group: group,
        mesh: mesh, // For raycasting
        ring: ring,
        data: data,
        angle: angle,
        baseDistance: data.baseDistance,
        speed: data.speed,
        parentPlanet: null,
        orbitRadius: data.baseDistance
      });
    });

    const moonSpecs = [
      {
        parentIndex: 3,
        name: 'Luna Dusk',
        subtitle: 'Moon of Becoming',
        poem: 'Still being shaped',
        color: 0xddd6cf,
        emissive: 0x5d5a59,
        size: 1.5,
        orbitRadius: 9,
        speed: 0.018,
        offset: 0.9
      },
      {
        parentIndex: 4,
        name: 'Morrow Ring',
        subtitle: 'Moon of Becoming',
        poem: 'Still being shaped',
        color: 0xd7c7b9,
        emissive: 0x544a43,
        size: 1.3,
        orbitRadius: 8.2,
        speed: 0.02,
        offset: 0.4
      },
      {
        parentIndex: 4,
        name: 'Aster Vale',
        subtitle: 'Moon of Becoming',
        poem: 'Still being shaped',
        color: 0xcdd5df,
        emissive: 0x4d5869,
        size: 1.2,
        orbitRadius: 11.5,
        speed: 0.016,
        offset: 1.7
      }
    ];

    moonSpecs.forEach((spec) => {
      const parentPlanet = planets[spec.parentIndex];
      const moonGroup = new THREE.Group();
      const moonTexture = createPlanetTexture('#dfe7f3', '#8b93a6', '#ffffff');
      const moonMaterial = new THREE.MeshStandardMaterial({
        map: moonTexture,
        color: 0xffffff,
        emissive: spec.emissive,
        emissiveIntensity: 0.7,
        roughness: 0.9,
        metalness: 0.05,
        bumpMap: moonTexture,
        bumpScale: 0.12
      });
      const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(spec.size, 32, 32), moonMaterial);
      moonMesh.userData = { isMoon: true, ...spec };
      moonGroup.add(moonMesh);
      scene.add(moonGroup);

      planets.push({
        group: moonGroup,
        mesh: moonMesh,
        ring: null,
        data: {
          id: spec.name.toLowerCase().replace(/\s+/g, '-'),
          name: spec.name,
          subtitle: spec.subtitle,
          poem: spec.poem,
          color: spec.color,
          emissive: spec.emissive,
          size: spec.size,
          baseDistance: 0,
          speed: spec.speed,
          isMoon: true
        },
        angle: spec.offset,
        baseDistance: 0,
        speed: spec.speed,
        parentPlanet: parentPlanet,
        orbitRadius: spec.orbitRadius
      });
    });

    const dwarfPlanetSpecs = [
      { name: 'Ceres Veil', subtitle: 'Dwarf World', poem: 'Still being shaped', color: 0xb8a9a4, emissive: 0x4a3e3f, size: 2.2, baseDistance: 145, speed: 0.0045, angle: 0.8 },
      { name: 'Mira Kesh', subtitle: 'Dwarf World', poem: 'Still being shaped', color: 0x9ca7b7, emissive: 0x2b3445, size: 2.5, baseDistance: 153, speed: 0.004, angle: 2.4 },
      { name: 'Eirn Fold', subtitle: 'Dwarf World', poem: 'Still being shaped', color: 0xc8b8e2, emissive: 0x3b2f49, size: 2.1, baseDistance: 160, speed: 0.0035, angle: 4.1 },
      { name: 'Nimble Rock', subtitle: 'Dwarf World', poem: 'Still being shaped', color: 0xb1987b, emissive: 0x44372f, size: 2.4, baseDistance: 169, speed: 0.0031, angle: 5.4 }
    ];

    dwarfPlanetSpecs.forEach((spec) => {
      const group = new THREE.Group();
      const texture = createPlanetTexture('#c2c9d1', '#6a7280', '#f3f4f6');
      const material = new THREE.MeshStandardMaterial({
        map: texture,
        color: 0xffffff,
        emissive: spec.emissive,
        emissiveIntensity: 0.8,
        roughness: 0.9,
        metalness: 0.05,
        bumpMap: texture,
        bumpScale: 0.1
      });
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(spec.size, 32, 32), material);
      mesh.userData = { isDwarf: true, ...spec };
      group.add(mesh);
      scene.add(group);

      planets.push({
        group,
        mesh,
        ring: null,
        data: { ...spec, id: spec.name.toLowerCase().replace(/\s+/g, '-') },
        angle: spec.angle,
        baseDistance: spec.baseDistance,
        speed: spec.speed,
        parentPlanet: null,
        orbitRadius: spec.baseDistance
      });
    });

    // --- STREAMING_CHUNK:Setting up Raycasting and Interactivity ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    
    let hoveredPlanet = null;
    let isZoomed = false;

    const hoverLabel = document.getElementById('hover-label');
    const selectionName = document.getElementById('selection-name');
    const selectionDesc = document.getElementById('selection-desc');
    const poemModal = document.getElementById('poem-modal');
    const btnBack = document.getElementById('btn-back');

    // Hover Interaction
    window.addEventListener('mousemove', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      if(isZoomed) return;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(planets.map(p => p.mesh));

      if (intersects.length > 0) {
        document.body.style.cursor = 'pointer';
        const object = intersects[0].object;
        hoveredPlanet = planets.find(p => p.mesh === object);
        
        hoverLabel.style.opacity = 1;
        hoverLabel.innerHTML = `${hoveredPlanet.data.name}`;
        selectionName.textContent = hoveredPlanet.data.name;
        selectionDesc.textContent = hoveredPlanet.data.subtitle;
      } else {
        document.body.style.cursor = 'default';
        hoveredPlanet = null;
        hoverLabel.style.opacity = 0;
      }
    });

    // --- STREAMING_CHUNK:Handling Camera Transitions and Modals ---
    // Click Interaction
    window.addEventListener('click', () => {
      if (hoveredPlanet && !isZoomed) {
        openPoemModal(hoveredPlanet);
      }
    });

    btnBack.addEventListener('click', closePoemModal);

    function openPoemModal(targetObj) {
      isZoomed = true;
      hoverLabel.style.opacity = 0;
      controls.enabled = false;

      planets.forEach((planet) => {
        const isSelected = planet.mesh === targetObj.mesh;
        planet.mesh.scale.setScalar(isSelected ? 1.22 : 0.96);
        if (planet.ring) {
          planet.ring.material.opacity = isSelected ? 0.15 : 0.04;
        }
      });

      // Update Modal Texts
      document.getElementById('modal-title').innerText = targetObj.data.name;
      document.getElementById('modal-subtitle').innerText = targetObj.data.subtitle;
      document.getElementById('modal-content').innerText = targetObj.data.poem;

      // Calculate camera position for viewing (offset along the orbit)
      const pPos = targetObj.group.position;
      const angle = Math.atan2(pPos.z, pPos.x);
      const camOffset = targetObj.data.size * 5; // Distance from planet
      
      const camTargetPos = new THREE.Vector3(
        pPos.x + Math.cos(angle) * camOffset,
        pPos.y + targetObj.data.size * 2, // Look slightly down
        pPos.z + Math.sin(angle) * camOffset
      );

      // Smooth camera flight
      gsap.to(camera.position, {
        x: camTargetPos.x,
        y: camTargetPos.y,
        z: camTargetPos.z,
        duration: 2.5,
        ease: "power2.inOut"
      });

      gsap.to(controls.target, {
        x: pPos.x,
        y: pPos.y,
        z: pPos.z,
        duration: 2.5,
        ease: "power2.inOut",
        onUpdate: () => controls.update(),
        onComplete: () => {
          poemModal.classList.add('active');
        }
      });
    }

    function closePoemModal() {
      poemModal.classList.remove('active');
      
      planets.forEach((planet) => {
        planet.mesh.scale.setScalar(1);
        if (planet.ring) {
          planet.ring.material.opacity = 0.04;
        }
      });

      // Return camera flight
      gsap.to(camera.position, {
        x: defaultCameraPos.x,
        y: defaultCameraPos.y,
        z: defaultCameraPos.z,
        duration: 2.5,
        ease: "power2.inOut"
      });

      gsap.to(controls.target, {
        x: 0,
        y: 0,
        z: 0,
        duration: 2.5,
        ease: "power2.inOut",
        onUpdate: () => controls.update(),
        onComplete: () => {
          isZoomed = false;
          controls.enabled = true;
        }
      });
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- STREAMING_CHUNK:Main Animation Loop (Serene Orbiting) ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Update shader uniform for twinkling stars
      starMaterial.uniforms.time.value = time;
      
      // Slow background rotation
      starMesh.rotation.y += 0.02 * delta;
      asteroidBelt.rotation.y += 0.025 * delta;

      // Predictable, serene orbital mechanics (Trigonometry based, no chaotic physics)
      planets.forEach(p => {
        if (!isZoomed) {
          if (p.parentPlanet) {
            const parentPos = p.parentPlanet.group.position;
            p.angle += p.speed;
            p.group.position.x = parentPos.x + Math.cos(p.angle) * p.orbitRadius;
            p.group.position.y = parentPos.y + Math.sin(p.angle * 1.2) * 2.4;
            p.group.position.z = parentPos.z + Math.sin(p.angle) * p.orbitRadius;
          } else {
            p.angle += p.speed;
            p.group.position.x = Math.cos(p.angle) * p.baseDistance;
            p.group.position.z = Math.sin(p.angle) * p.baseDistance;
          }
        }
        
        const activeScale = hoveredPlanet && hoveredPlanet.mesh === p.mesh ? 1.14 : 1;
        p.mesh.scale.lerp(new THREE.Vector3(activeScale, activeScale, activeScale), 0.08);

        if (p.ring) {
          const ringOpacity = hoveredPlanet && hoveredPlanet.mesh === p.mesh ? 0.1 : 0.04;
          p.ring.material.opacity = THREE.MathUtils.lerp(p.ring.material.opacity, ringOpacity, 0.08);
        }
        
        // Gentle axis rotation
        p.mesh.rotation.y += 0.005;
        p.mesh.rotation.x += 0.002;
      });

      // Update Hover Label Position relative to planet in 2D space
      if (hoveredPlanet && !isZoomed) {
        const vector = hoveredPlanet.group.position.clone();
        vector.y += hoveredPlanet.data.size + 3; // Offset above
        vector.project(camera);

        const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
        const y = (vector.y * -0.5 + 0.5) * window.innerHeight;

        hoverLabel.style.left = `${x}px`;
        hoverLabel.style.top = `${y}px`;
      }

      if (!isZoomed) controls.update();
      renderer.render(scene, camera);
    }

    animate();

  </script>
</body>
</html>
