<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petra | Celestial Echoes</title>
<meta name="color-scheme" content="dark">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg-0: #020106;
  --bg-vignette: radial-gradient(ellipse at 50% 50%, #150a1a 0%, #0a0815 45%, #030206 80%, #010102 100%);
  --cream: #f4f0e6;
  --cream-dim: #c5c0b5;
  --muted: #8b92a5;
  --muted-2: #5f667a;
  --line: rgba(180, 195, 225, 0.25);
  --accent-stellar: #ffb86c;
  --accent-lunara: #8be9fd;
  --card-bg: rgba(12, 14, 25, 0.65);
  --card-border: rgba(255, 255, 255, 0.1);
  --ease: cubic-bezier(0.22, 0.9, 0.3, 1);
  --px: 0px;
  --py: 0px;
}

* { box-sizing: border-box; }
html, body { 
  margin: 0; padding: 0; background: var(--bg-0); color: var(--cream); 
  font-family: 'Inter', system-ui, sans-serif; 
}
body { min-height: 100vh; overflow-x: hidden; }

/* Parallax Layers */
#backdrop { position: fixed; inset: -50px; background: var(--bg-vignette); z-index: 0; }
#space-layer {
  position: fixed; inset: -50px; z-index: 0; pointer-events: none;
  transform: translate(calc(var(--px) * -1.5), calc(var(--py) * -1.5));
  transition: transform 0.1s ease-out;
}
#nebula-layer {
  position: fixed; inset: -50px; z-index: 1; pointer-events: none;
  transform: translate(calc(var(--px) * -0.8), calc(var(--py) * -0.8));
  transition: transform 0.1s ease-out;
}
#ui-layer {
  position: relative; z-index: 5;
  transform: translate(calc(var(--px) * 0.5), calc(var(--py) * 0.5));
  transition: transform 0.1s ease-out;
}

/* Stars */
.star-p { 
  position: absolute; border-radius: 50%; 
  background: var(--sc, #fff); 
  box-shadow: 0 0 calc(var(--size) * 3) var(--sc);
}
@keyframes twinkle { 
  0%, 100% { opacity: var(--dim, 0.2); transform: scale(0.8); } 
  50% { opacity: var(--bright, 0.9); transform: scale(1.2); } 
}

/* Gas Clouds */
.stage-cloud {
  position: absolute; border-radius: 50%; transform: translate(-50%, -50%);
  filter: blur(8vmin); mix-blend-mode: screen; pointer-events: none;
  animation: cloud-pulse alternate infinite;
}
@keyframes cloud-pulse {
  0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
  100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
}
.star-halo {
  position: absolute; border-radius: 50%; transform: translate(-50%, -50%); z-index: 2;
  pointer-events: none; filter: blur(20px); mix-blend-mode: screen;
}

/* UI Elements */
#topbar { display: flex; justify-content: space-between; align-items: center; padding: 22px 26px; }
#back-link {
  display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
  font-size: 13px; letter-spacing: 0.05em; color: var(--muted); transition: color 200ms var(--ease);
}
#back-link:hover { color: var(--cream); }
#back-link svg { width: 14px; height: 14px; }
#site-mark { font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: 0.1em; color: var(--muted-2); }

#page-head { text-align: center; padding: 10px 24px 30px; max-width: 560px; margin: 0 auto; }
#page-head .eyebrow { font-size: 11px; letter-spacing: 0.25em; color: var(--muted-2); margin-bottom: 12px; }
#page-head h1 { margin: 0; font-family: 'Cormorant Garamond', serif; font-size: clamp(32px, 5vw, 48px); font-weight: 600; color: var(--cream); }
#page-head .tagline { font-size: 14px; color: var(--muted); line-height: 1.6; margin: 16px auto 0; font-weight: 300; }

/* Stage */
#stage-wrap { display: flex; align-items: center; justify-content: center; padding: 0 20px 80px; }
#orbit-stage { position: relative; width: min(90vw, 75vh, 800px); height: min(90vw, 75vh, 800px); flex-shrink: 0; }
#orbit-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; z-index: 1; pointer-events: none; }
.leader-line { stroke: var(--line); stroke-width: 1.5; opacity: 0; transition: opacity 400ms var(--ease); stroke-dasharray: 4 4; }
.leader-line.shown { opacity: 0.8; stroke-dasharray: none; }

/* Interactive Nodes */
.star-node {
  position: absolute; width: 16px; height: 16px; border-radius: 50%; z-index: 4;
  transform: translate(-50%, -50%); cursor: pointer;
  transition: transform 300ms var(--ease), box-shadow 300ms var(--ease);
}
.star-node::after {
  content: ''; position: absolute; inset: -10px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.2); opacity: 0; transform: scale(0.5);
  transition: all 300ms var(--ease);
}
.star-node:hover, .star-node:focus-visible { transform: translate(-50%, -50%) scale(1.4); }
.star-node:hover::after { opacity: 1; transform: scale(1.2); animation: spin 4s linear infinite; }

@keyframes spin { 100% { transform: scale(1.2) rotate(360deg); } }

/* Glassmorphic Cards */
.poem-chip {
  position: absolute; width: 180px; z-index: 10; transform: translate(-50%, -50%) scale(0.95);
  background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px;
  padding: 18px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
  opacity: 0; pointer-events: none; transition: all 300ms var(--ease); text-align: center;
}
.poem-chip.shown { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
.poem-chip .num { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 8px; }
.poem-chip h3 { margin: 0 0 8px; font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; color: var(--cream); }
.poem-chip p { margin: 0 0 14px; font-size: 11px; line-height: 1.5; color: var(--cream-dim); font-weight: 300; }
.chip-btn {
  font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 0.05em; padding: 8px 18px;
  border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); color: var(--cream);
  background: rgba(255,255,255,0.05); cursor: pointer; transition: all 200ms ease;
}
.chip-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }

/* Modal */
#modal-veil {
  position: fixed; inset: 0; z-index: 50; background: rgba(2, 1, 6, 0.85); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  opacity: 0; pointer-events: none; transition: opacity 400ms var(--ease);
}
#modal-veil.show { opacity: 1; pointer-events: auto; }
#poem-modal {
  width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto;
  background: rgba(15, 12, 25, 0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px;
  padding: 40px; position: relative;
  box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
  transform: translateY(20px) scale(0.95); opacity: 0; transition: all 400ms var(--ease);
}
#modal-veil.show #poem-modal { transform: translateY(0) scale(1); opacity: 1; }
#modal-close {
  position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.05); border: none; color: var(--muted);
  font-size: 24px; cursor: pointer; width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; transition: all 200ms ease;
}
#modal-close:hover { color: #fff; background: rgba(255,255,255,0.15); }
#modal-title { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 600; margin: 0 0 24px; color: var(--cream); text-align: center; }
#modal-body { font-family: 'Cormorant Garamond', serif; font-size: 19px; line-height: 1.8; color: var(--cream-dim); white-space: pre-line; text-align: center; }

/* Responsive Stacked Mode */
body.stacked #orbit-svg, body.stacked .star-node, body.stacked .stage-cloud, body.stacked .star-halo { display: none; }
body.stacked #orbit-stage { width: 100%; height: auto; }
body.stacked .poem-chip {
  position: relative; inset: auto; transform: none !important; opacity: 1; pointer-events: auto;
  width: min(90vw, 400px); margin: 0 auto 20px; display: block; text-align: center;
}
body.stacked #poem-list { display: flex; flex-direction: column; align-items: center; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}
</style>
</head>
<body>

<div id="backdrop"></div>
<div id="space-layer" id="stars"></div>
<div id="nebula-layer"></div>

<div id="ui-layer">
  <div id="topbar">
    <a id="back-link" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
      Back to Petra
    </a>
    <span id="site-mark">PETRA</span>
  </div>

  <header id="page-head">
    <div class="eyebrow">STELLAR & LUNARA</div>
    <h1>Celestial Echoes</h1>
    <p class="tagline">Born of the Orion Nebula. A dichotomy of blazing gold and tranquil ice, written in the stars.</p>
  </header>

  <div id="stage-wrap">
    <div id="orbit-stage">
      <svg id="orbit-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <g id="leader-lines"></g>
      </svg>
      <div id="poem-list"></div>
    </div>
  </div>
</div>

<div id="modal-veil">
  <div id="poem-modal" role="dialog" aria-modal="true">
    <button id="modal-close" aria-label="Close">&times;</button>
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // Stellar (Gold/Fire) and Lunara (Cyan/Ice) Themes
  const POEMS = [
    { num:"01", type:"stellar", title:"Nova", blurb:"The roar of ignition; life demanding to be felt.",
      angle:-60, radius:18, gas:"rgba(255, 120, 80, 0.5)", color:"#ff8a50",
      text:"I am the fire that tears the dark apart,\nThe sudden heartbeat of a dying star.\nI ask no permission to exist,\nOnly that you witness the heat." },
    { num:"02", type:"lunara", title:"Eclipse", blurb:"The quiet moment when shadows align.",
      angle:195, radius:24, gas:"rgba(100, 200, 255, 0.4)", color:"#8be9fd",
      text:"In the absence of your light, I do not fade.\nI become the silver lining of the void.\nA gentle reflection, holding the memory\nOf a warmth I cannot touch." },
    { num:"03", type:"stellar", title:"Supernova", blurb:"Destruction that seeds the cosmos.",
      angle:45, radius:32, gas:"rgba(255, 60, 100, 0.5)", color:"#ff5252",
      text:"Burn it all down.\nLet the core collapse.\nFrom this wreckage, a thousand new worlds\nWill learn how to breathe." },
    { num:"04", type:"lunara", title:"Voidsong", blurb:"The silence between the celestial bodies.",
      angle:260, radius:35, gas:"rgba(130, 100, 255, 0.4)", color:"#b388ff",
      text:"Listen to the space between the stars.\nIt is not empty.\nIt is the held breath of the universe,\nWaiting for you to speak." },
    { num:"05", type:"stellar", title:"Solar Wind", blurb:"A violent, beautiful storm of particles.",
      angle:120, radius:28, gas:"rgba(255, 200, 50, 0.4)", color:"#ffd740",
      text:"I cross the expanse not with grace,\nBut with fury.\nI paint the poles of distant planets\nWith the colors of my rage." },
    { num:"06", type:"lunara", title:"Stardust", blurb:"The cold remnants of ancient light.",
      angle:-10, radius:38, gas:"rgba(150, 230, 240, 0.4)", color:"#84ffff",
      text:"We are the quiet aftermath.\nThe dust settling on the cosmic floor.\nOnce we were fire;\nNow, we are poetry." }
  ];

  const stage = document.getElementById("orbit-stage");
  const list = document.getElementById("poem-list");
  const leaderLayer = document.getElementById("leader-lines");
  const nebulaLayer = document.getElementById("nebula-layer");
  const spaceLayer = document.getElementById("space-layer");

  function polar(angleDeg, radiusPct){
    const a = angleDeg * Math.PI/180;
    return { x: 50 + radiusPct*Math.cos(a), y: 50 + radiusPct*Math.sin(a) };
  }

  // 1. Generate Deep Orion Nebula Clouds
  const ORION_CLOUDS = [
    { x:40, y:40, size:60, color:"rgba(255, 20, 147, 0.2)", dur: "15s" }, // Deep Pink
    { x:60, y:60, size:70, color:"rgba(0, 255, 255, 0.15)", dur: "20s" }, // Cyan
    { x:50, y:50, size:50, color:"rgba(255, 165, 0, 0.25)", dur: "12s" }, // Warm Gold core
    { x:30, y:70, size:55, color:"rgba(75, 0, 130, 0.3)", dur: "18s" },   // Indigo
    { x:70, y:30, size:65, color:"rgba(255, 105, 180, 0.15)", dur: "25s" } // Hot Pink
  ];
  
  ORION_CLOUDS.forEach(c => {
    const el = document.createElement("div");
    el.className = "stage-cloud";
    el.style.left = c.x + "%"; el.style.top = c.y + "%";
    el.style.width = c.size + "vw"; el.style.height = c.size + "vw";
    el.style.background = `radial-gradient(circle, ${c.color} 0%, transparent 60%)`;
    el.style.animationDuration = c.dur;
    nebulaLayer.appendChild(el);
  });

  // 2. Generate Interactive Poem Nodes
  POEMS.forEach((p) => {
    const pos = polar(p.angle, p.radius);
    const labelPos = polar(p.angle, p.radius + 12); 

    // Star Halo
    const halo = document.createElement("div");
    halo.className = "star-halo";
    halo.style.left = pos.x + "%"; halo.style.top = pos.y + "%";
    halo.style.width = "20%"; halo.style.height = "20%";
    halo.style.background = `radial-gradient(circle, ${p.gas} 0%, transparent 70%)`;
    stage.appendChild(halo);

    // Node
    const star = document.createElement("div");
    star.className = "star-node";
    star.style.left = pos.x + "%"; star.style.top = pos.y + "%";
    star.style.background = `radial-gradient(circle, #fff 0%, ${p.color} 40%, transparent 80%)`;
    star.style.boxShadow = `0 0 15px 4px ${p.color}`;
    star.setAttribute("role","button");
    star.setAttribute("tabindex","0");
    stage.appendChild(star);

    // Leader Line
    const line = document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("class","leader-line");
    line.setAttribute("x1", pos.x); line.setAttribute("y1", pos.y);
    line.setAttribute("x2", labelPos.x); line.setAttribute("y2", labelPos.y);
    leaderLayer.appendChild(line);

    // Glassmorphic Card
    const chip = document.createElement("div");
    chip.className = "poem-chip";
    chip.style.left = labelPos.x + "%"; chip.style.top = labelPos.y + "%";
    chip.innerHTML = `
      <div class="num">${p.num} &mdash; ${p.type.toUpperCase()}</div>
      <h3>${p.title}</h3>
      <p>${p.blurb}</p>
      <button class="chip-btn" type="button">Read Poem</button>
    `;
    stage.appendChild(chip);
    list.appendChild(chip.cloneNode(true)); // For mobile

    const openThis = () => openPoem(p);
    star.addEventListener("click", openThis);
    chip.querySelector(".chip-btn").addEventListener("click", openThis);

    const reveal = () => { chip.classList.add("shown"); line.classList.add("shown"); };
    const hide = () => { chip.classList.remove("shown"); line.classList.remove("shown"); };
    star.addEventListener("mouseenter", reveal);
    star.addEventListener("mouseleave", hide);
    chip.addEventListener("mouseenter", reveal);
    chip.addEventListener("mouseleave", hide);
  });

  // Attach events to mobile cloned chips
  document.querySelectorAll('#poem-list .poem-chip').forEach((c, idx) => {
    c.querySelector('.chip-btn').addEventListener('click', () => openPoem(POEMS[idx]));
  });

  // 3. Dense Core Starfield (1500 stars, cubic distribution to cluster in center)
  const isMobile = window.innerWidth < 760;
  const STAR_COUNT = isMobile ? 300 : 1500;
  const fragment = document.createDocumentFragment();
  
  for(let i=0; i<STAR_COUNT; i++){
    const el = document.createElement("div");
    el.className = "star-p";
    
    // Cubic distribution for core clustering
    const angle = Math.random() * Math.PI * 2;
    const distance = Math.pow(Math.random(), 3) * 60; // 0 to 60% distance from center
    const x = 50 + Math.cos(angle) * distance;
    const y = 50 + Math.sin(angle) * distance;
    
    const size = Math.random() * 2;
    const isBright = Math.random() > 0.8;
    
    el.style.left = x + "%";
    el.style.top = y + "%";
    el.style.setProperty("--size", size + "px");
    el.style.width = size + "px";
    el.style.height = size + "px";
    
    // Tint stars based on Orion Nebula colors
    const r = Math.random();
    let color = "#fff";
    if(r > 0.9) color = "#ffb86c"; // Stellar Gold
    else if(r > 0.8) color = "#8be9fd"; // Lunara Ice
    else if(r > 0.7) color = "#ff79c6"; // Nebula Pink
    
    el.style.setProperty("--sc", color);
    
    if(isBright) {
      el.style.animation = `twinkle ${2 + Math.random() * 4}s ease-in-out infinite ${-Math.random() * 5}s`;
    } else {
      el.style.opacity = Math.random() * 0.5 + 0.1;
    }
    
    fragment.appendChild(el);
  }
  spaceLayer.appendChild(fragment);

  // 4. Parallax Effect
  document.addEventListener('mousemove', (e) => {
    if(isMobile) return;
    const x = (e.clientX / window.innerWidth - 0.5) * 40; // max 20px shift
    const y = (e.clientY / window.innerHeight - 0.5) * 40;
    document.documentElement.style.setProperty('--px', `${x}px`);
    document.documentElement.style.setProperty('--py', `${y}px`);
  });

  // 5. Modal Logic
  const veil = document.getElementById("modal-veil");
  const modalTitle = document.getElementById("modal-title");
  const modalBody = document.getElementById("modal-body");

  function openPoem(p){
    modalTitle.style.color = p.color;
    modalTitle.textContent = p.title;
    modalBody.textContent = p.text;
    veil.classList.add("show");
  }
  
  function closePoem(){ veil.classList.remove("show"); }
  document.getElementById("modal-close").addEventListener("click", closePoem);
  veil.addEventListener("click", e => { if(e.target===veil) closePoem(); });
  window.addEventListener("keydown", e => { if(e.key==="Escape") closePoem(); });

  // 6. Responsive layout toggle
  function applyLayoutMode(){
    if(window.innerWidth < 760){
      document.body.classList.add("stacked");
      document.getElementById('poem-list').style.display = 'flex';
    } else {
      document.body.classList.remove("stacked");
      document.getElementById('poem-list').style.display = 'none';
    }
  }
  window.addEventListener("resize", applyLayoutMode);
  applyLayoutMode();

})();
</script>
</body>
</html>
